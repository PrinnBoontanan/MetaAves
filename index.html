<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MetaAves</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <header class="game-header">
            <h1>MetaAves</h1>
            <p>The Taxonomic Bird Game</p>
        </header>


        <!-- Game information -->
        <section class="game-info">

            <div class="mode-display">
                Mode: <strong id="game-mode">World Birds</strong>
            </div>

            <div class="guess-counter">
                Guesses: <strong id="guess-count">12</strong>
            </div>

            <button id="new-game-button" class="new-game-button" type="button">
                New Game
            </button>

        </section>


        <!-- Guessing area -->
        <section class="guess-section">

            <h2>Guess the mystery bird</h2>

            <div class="search-container">

                <input
                    type="text"
                    id="bird-search"
                    placeholder="Enter an English bird name..."
                    autocomplete="off"
                >

                <button id="guess-button">
                    Guess
                </button>

            </div>

            <div id="suggestions" class="suggestions"></div>

        </section>


        <!-- Taxonomy tree -->
        <section class="taxonomy-section">

            <h2>Taxonomy</h2>

            <div id="taxonomy-tree" class="taxonomy-tree">

                <p class="tree-placeholder">
                    Your guesses will appear here.
                </p>

            </div>

        </section>


        <!-- Taxon information -->
        <section class="taxon-section">

            <h2>Taxon Information</h2>

            <div id="taxon-card" class="taxon-card">

                <h3>Select a taxon</h3>

                <p>
                    Click a taxon in the tree to learn more about it.
                </p>

            </div>

        </section>

    </main>


    <div id="game-over-overlay" class="game-over-overlay">
        <div class="game-over-card" role="dialog" aria-modal="true">

            <button id="game-over-close" class="game-over-close" type="button" aria-label="Close">×</button>

            <p class="study-card-label">Bird Study Card</p>
            <h2 id="game-over-title">Game Over</h2>
            <p id="game-over-message"></p>

            <div class="study-card-bird">
                <h3 id="study-bird-name"></h3>
                <p id="study-scientific-name" class="scientific-name"></p>
            </div>

            <div class="study-card-details">
                <div>
                    <strong>Thai name</strong>
                    <p id="study-thai-name"></p>
                </div>
                <div>
                    <strong>Taxonomy</strong>
                    <p id="study-taxonomy"></p>
                </div>
            </div>

            <div class="game-over-actions">
                <button id="game-over-replay" type="button">New Game</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
